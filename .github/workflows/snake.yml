name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Feed the snake (extra green squares)
        run: node scripts/enrich-snake.js dist

      - name: Install headless Chromium
        run: |
          npm i playwright-core@1.49.1 --no-fund --no-audit
          npx playwright@1.49.1 install --with-deps chromium

      - name: Build and render banner GIF
        run: |
          FF=$(ls "$HOME"/.cache/ms-playwright/ffmpeg-*/ffmpeg-linux 2>/dev/null | head -1)
          if [ -z "$FF" ] || ! "$FF" -hide_banner -filters 2>/dev/null | grep -q palettegen; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            FF=ffmpeg
          fi
          node scripts/build-banner.js
          node scripts/render-snake.js dist/banner.html frames-banner 10 8 2
          mkdir -p assets
          "$FF" -y -framerate 10 -i frames-banner/frame-%04d.png -vf "scale=880:192:flags=lanczos,palettegen=max_colors=256:stats_mode=diff" frames-banner/palette.png
          "$FF" -y -framerate 10 -i frames-banner/frame-%04d.png -i frames-banner/palette.png -lavfi "scale=880:192:flags=lanczos,paletteuse=dither=sierra2_4a:diff_mode=rectangle" -loop 0 assets/banner.gif

      - name: Copy banner to dist
        run: mkdir -p dist/assets && cp assets/banner.gif dist/assets/banner.gif

      - name: Push snake GIFs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
