<script>
var T = 32, TOTAL = 2048, SPEED = 64;
var HEAD_PATH = [[8,-8],[8,8],[40,8],[40,40],[8,40],[8,104],[744,104],[744,56],[824,56],[824,104],[840,104],[840,8],[72,8],[72,-8],[8,-8]];
var CUM = [0,16,48,80,112,176,912,960,1040,1088,1104,1200,1968,1984,2048];
var EATEN_COLOR = "#1d222a";
var GROWTH = [null,null,null,28.03125];
function posAt(s) {
  s = ((s % TOTAL) + TOTAL) % TOTAL;
  var i = 0;
  while (i < CUM.length - 2 && CUM[i + 1] < s) i++;
  var t = (s - CUM[i]) / (CUM[i + 1] - CUM[i]);
  return [HEAD_PATH[i][0] + t * (HEAD_PATH[i + 1][0] - HEAD_PATH[i][0]),
          HEAD_PATH[i][1] + t * (HEAD_PATH[i + 1][1] - HEAD_PATH[i][1])];
}
function length(t) {
  var n = 0;
  for (var gi = 0; gi < GROWTH.length; gi++) if (t >= GROWTH[gi]) n++;
  return 4 + n;
}
var foodEls = [];
var allRects = document.getElementsByTagName("rect");
for (var ri = 0; ri < allRects.length; ri++) {
  if (allRects[ri].className.baseVal === "f") foodEls.push(allRects[ri]);
}
for (var fi = 0; fi < foodEls.length; fi++) {
  foodEls[fi].dataset.fresh = foodEls[fi].getAttribute("fill");
}
var headEl = document.getElementById("head");
var segEls = [];
for (var si = 1; si < 8; si++) segEls.push(document.getElementById("seg" + si));
function frame() {
  var t = ((performance.now() / 1000) % T + T) % T;
  var sHead = t * SPEED;
  var L = length(t);
  var headHue = (sHead / TOTAL * 360) % 360;
  var pos = posAt(sHead);
  headEl.setAttribute("transform", "translate(" + (pos[0] - 7.2).toFixed(2) + "," + (pos[1] - 7.2).toFixed(2) + ")");
  headEl.setAttribute("fill", "hsl(" + headHue.toFixed(1) + ",90%,58%)");
  for (var i = 0; i < segEls.length; i++) {
    var el = segEls[i];
    if (i >= L - 1) { el.style.display = "none"; continue; }
    el.style.display = "";
    var sp = posAt(sHead - (i + 1) * 16);
    el.setAttribute("transform", "translate(" + (sp[0] - 6).toFixed(2) + "," + (sp[1] - 6).toFixed(2) + ")");
    el.setAttribute("fill", "hsl(" + ((headHue + (i + 1) * 25) % 360).toFixed(1) + ",90%,58%)");
  }
  for (var j = 0; j < foodEls.length; j++) {
    var fel = foodEls[j];
    fel.setAttribute("fill", t >= +fel.dataset.eat ? EATEN_COLOR : fel.dataset.fresh);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
